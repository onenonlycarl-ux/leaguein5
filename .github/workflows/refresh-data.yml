name: Refresh standings and schedules

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
    - cron: "47 0-4,17-23 * * 0,1,4"   # extra checks around Sunday, Monday, Thursday games (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch standings and schedules
        run: python3 pipeline/fetch_data.py 2026
      - name: Commit if changed
        run: |
          git config user.name "league-in-5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
